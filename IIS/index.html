<style>
@font-face { font-family: "RuV Sans"; font-weight: 300; font-style: normal; font-display: swap; src: url("AppData/fonts/RuVSans-Light.woff2") format("woff2"); }
@font-face { font-family: "RuV Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("AppData/fonts/RuVSans-Regular.woff2") format("woff2"); }
@font-face { font-family: "RuV Sans"; font-weight: 700; font-style: normal; font-display: swap; src: url("AppData/fonts/RuVSans-Bold.woff2") format("woff2"); }
@font-face { font-family: "RuV Sans"; font-weight: 900; font-style: normal; font-display: swap; src: url("AppData/fonts/RuVSans-Black.woff2") format("woff2"); }

@font-face { font-family: "RuV Slab"; font-weight: 700; font-style: normal; font-display: swap; src: url("AppData/fonts/RuVSlab-Bold.woff2") format("woff2"); }
@font-face { font-family: "RuV-Icons-v3"; font-weight: 400; font-style: normal; font-display: block; src: url("AppData/fonts/RuV-Icons-v3.woff2") format("woff2"); }

/* Layout: weisser Seitenrahmen im R+V-Stil (dunkelblaue Schrift, orange Ueberschriften-Highlights, mintfarbene Interaktion),
   der Katalog liegt als dunkelblaue "Buehne" (Netflix-Stil) mit Kachelreihen pro Thema. */
:root {
  --font: "RuV Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; /* R+V-Schrift: Light/Regular/Bold/Black, siehe @font-face oben */
  --bg: #ffffff;
  --surface: #f5f5f5;
  --surface-2: #ececec;
  --line: #c7c7c7;
  --text: #001957;
  --muted: #707070;
  --accent: #eb6504;
  --link: #167b8a;
  --mint: #109da8;
  --mint-hover: #00dcdc;
  --on-mint: #001957;
  --blue: #001957;
  --sand: #fff4e0;
  --danger: #b3261e;
  --danger-bg: #ffe9e9;
  --ok: #4d6a03;
  --ok-bg: #f0f8e3;
  --shadow: none;
  --focus: #eb6504;
  --r: 4px;
  --font-slab: "RuV Slab", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #001957; --surface: #001957; --surface-2: #001957; --line: #a2abc2; --text: #ffffff; --muted: #bdc4d4; --mint: #00dcdc; --mint-hover: #2ee6e6;
    --accent: #f79506; --link: #5befef; --sand: #001957; --danger: #ff8484; --danger-bg: #4a1a2a; --ok: #8ebc27; --ok-bg: #12331f;
    --shadow: none; --focus: #f79506; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #001957; --surface: #001957; --surface-2: #001957; --line: #a2abc2; --text: #ffffff; --muted: #bdc4d4; --mint: #00dcdc; --mint-hover: #2ee6e6;
  --accent: #f79506; --link: #5befef; --sand: #001957; --danger: #ff8484; --danger-bg: #4a1a2a; --ok: #8ebc27; --ok-bg: #12331f;
  --shadow: none; --focus: #f79506; color-scheme: dark;
}
/* Katalog-Buehne: immer dunkel, unabhaengig vom Theme */
.stage {
  --bg: #001957; --surface: #0b2a6e; --surface-2: #143a86; --line: #2a4585; --text: #ffffff; --muted: #c4cde3;
  --accent: #f79506; --link: #5befef; --focus: #f79506; --mint: #00dcdc; --mint-hover: #2ee6e6; --danger: #ff8484; --danger-bg: #4a1a2a; --ok: #8ebc27;
  background: var(--bg); color: var(--text); color-scheme: dark; transition: background-color .25s;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw + .5rem, 3rem); font-weight: 900; letter-spacing: -.01em; }
h2 { font-size: 1.6rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--link); }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 720px) { .wrap { padding-inline: 32px; } }
@media (min-width: 1400px) { .wrap.wide { padding-inline: 48px; } }
.accent { color: var(--accent); }
.wrap.wide { max-width: none; }

/* ---------- Kopf ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--surface-2); }
.top .wrap { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text); min-width: 0; }
.brand img { height: 34px; width: auto; display: block; }
.brand .sep { width: 1px; height: 28px; background: var(--line); }
.brand .name { font-weight: 700; font-size: 1.2rem; letter-spacing: -.01em; white-space: nowrap; }
.brand .name .at { color: var(--accent); }
nav.main { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.main a { text-decoration: none; color: var(--text); font-weight: 600; padding: 8px 14px; border-radius: 999px; font-size: .95rem; display: inline-flex; gap: 6px; align-items: center; }
nav.main a:hover { background: var(--surface); }
nav.main a[aria-current="page"] { background: var(--blue); color: #fff; }
:root[data-theme="dark"] nav.main a[aria-current="page"] { background: var(--mint); color: var(--on-mint); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) nav.main a[aria-current="page"] { background: var(--mint); color: var(--on-mint); } }
@media (max-width: 760px) {
  nav.main { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  nav.main a { white-space: nowrap; }
  .brand .name { font-size: 1.05rem; }
}
.demo-banner { background: var(--sand); color: var(--text); font-size: .875rem; border-bottom: 1px solid var(--line); }
.demo-banner .wrap { padding-block: 8px; display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.demo-banner b { color: var(--accent); }

main { min-height: 60vh; }
.page { padding-block: 32px 64px; }
.page > .wrap > h1 { margin-bottom: 8px; }
.lead { font-size: 1.1rem; font-weight: 300; color: var(--muted); max-width: 62ch; }
.narrow { max-width: 820px; }

footer.foot { background: var(--blue); color: #fff; font-size: .9rem; }
footer.foot .wrap { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: center; padding-block: 24px; }
footer.foot img { height: 30px; width: auto; }
footer.foot a { color: #00dcdc; }
footer.foot .sp { margin-left: auto; opacity: .8; }

/* ---------- Buttons & Formularelemente ---------- */
.btn { font: inherit; font-weight: 700; border: 2px solid transparent; border-radius: 999px; padding: 11px 24px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; line-height: 1.2; min-height: 46px; transition: background .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--mint); color: var(--on-mint); }
.btn-primary:hover { background: var(--mint-hover); }
.btn-secondary { background: transparent; color: var(--text); border-color: currentColor; }
.btn-secondary:hover { background: var(--surface); }
.stage .btn-secondary:hover { background: rgba(255, 255, 255, .1); }
.btn-danger { background: transparent; color: var(--danger); border-color: currentColor; }
.btn-danger:hover { background: var(--danger-bg); }
.btn-sm { padding: 6px 14px; min-height: 36px; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg, .ico { width: 1.1em; height: 1.1em; flex: none; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 700; font-size: .95rem; }
.field .req { color: var(--accent); }
.hint { font-size: .85rem; color: var(--muted); }
.err { font-size: .875rem; color: var(--danger); font-weight: 600; }
input[type=text], input[type=email], input[type=url], input[type=number], input[type=password], input[type=search], input[type=date], select, textarea {
  font: inherit; color: var(--text); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0;
}
select { padding-right: 8px; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.invalid input, .invalid select, .invalid .rte, .invalid .seg { border-color: var(--danger); }
.stage input, .stage select { background: var(--surface); border-color: var(--line); }
::placeholder { color: var(--muted); opacity: .8; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--bg); max-width: 100%; }
.seg label, .seg button { font: inherit; font-weight: 700; padding: 8px 18px; border-radius: 999px; cursor: pointer; border: 0; background: transparent; color: var(--text); font-size: .95rem; white-space: nowrap; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked), .seg button[aria-pressed="true"] { background: var(--mint); color: var(--on-mint); }
.seg label:has(input:focus-visible), .seg button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.stage .seg { background: var(--surface); }
.field > .seg { align-self: flex-start; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.form { display: flex; flex-direction: column; gap: 32px; margin-top: 28px; }
.fs { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.fs > legend { font-size: 1.25rem; font-weight: 700; padding: 0; margin-bottom: 4px; color: var(--accent); float: left; width: 100%; }
.fs > legend + * { clear: both; }
.panel { background: var(--surface); border-radius: 16px; padding: 24px; }
.notice { border-radius: 12px; padding: 12px 16px; font-size: .95rem; background: var(--sand); }
.notice.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.notice.bad { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
.notice.info { background: var(--surface); }

/* ---------- Editor ---------- */
.rte { border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.rte:focus-within { border-color: var(--focus); }
.rte-bar { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; background: var(--surface); border-bottom: 1px solid var(--line); }
.rte-bar button { font: inherit; border: 0; background: transparent; color: var(--text); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.rte-bar button:hover { background: var(--surface-2); }
.rte-bar button[aria-pressed="true"] { background: var(--mint); color: var(--on-mint); }
.rte-bar .sepv { width: 1px; background: var(--line); margin: 4px 6px; }
.rte-link { display: flex; gap: 8px; padding: 8px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rte-link input { flex: 1 1 200px; min-height: 38px; }
.rte-area { min-height: 170px; max-height: 420px; overflow-y: auto; padding: 12px 14px; outline: none; }
.rte-area:empty::before { content: attr(data-ph); color: var(--muted); }
.rte-foot { display: flex; justify-content: space-between; padding: 4px 12px 8px; font-size: .8rem; color: var(--muted); }
.rich h3, .rte-area h3 { font-size: 1.1rem; margin: .8em 0 .3em; }
.rich p, .rte-area p, .rte-area div { margin: 0 0 .6em; }
.rich ul, .rich ol, .rte-area ul, .rte-area ol { margin: 0 0 .7em; padding-left: 1.4em; }
.rich blockquote, .rte-area blockquote { margin: 0 0 .7em; padding: 4px 14px; border-left: 4px solid var(--mint); background: var(--surface); }

/* ---------- Bild-Upload ---------- */
.imgpick { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.imgprev { width: 160px; height: 160px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: .85rem; text-align: center; padding: 8px; flex: none; }
.imgprev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.crop { width: min(100%, 360px); margin-inline: auto; }
.crop-box { position: relative; width: 100%; aspect-ratio: 1; background: #000; border-radius: 10px; overflow: hidden; touch-action: none; cursor: grab; }
.crop-box canvas { width: 100%; height: 100%; display: block; }
.crop-box::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: 2px solid rgba(255, 255, 255, .9); border-radius: 10px;
  background: linear-gradient(to right, transparent 33%, rgba(255,255,255,.4) 33%, rgba(255,255,255,.4) calc(33% + 1px), transparent calc(33% + 1px), transparent 66%, rgba(255,255,255,.4) 66%, rgba(255,255,255,.4) calc(66% + 1px), transparent calc(66% + 1px)),
             linear-gradient(to bottom, transparent 33%, rgba(255,255,255,.4) 33%, rgba(255,255,255,.4) calc(33% + 1px), transparent calc(33% + 1px), transparent 66%, rgba(255,255,255,.4) 66%, rgba(255,255,255,.4) calc(66% + 1px), transparent calc(66% + 1px)); }
.zoomrow { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
.zoomrow input[type=range] { flex: 1; min-height: 0; accent-color: #109da8; padding: 0; border: 0; }

/* ---------- Modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(0, 10, 40, .7); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
.modal { background: var(--bg); color: var(--text); border-radius: 20px; width: 100%; max-width: 640px; box-shadow: var(--shadow); position: relative; margin-block: auto; overflow: hidden; }
.modal.wide { max-width: 860px; }
.modal-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0, 25, 87, .85); color: #fff; cursor: pointer; font-size: 1.3rem; line-height: 1; display: grid; place-items: center; }
.modal-x:hover { background: #001957; }
.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.modal-head { display: flex; gap: 20px; }
.modal-head .thumb { width: 200px; flex: none; }
.modal-cover { position: relative; aspect-ratio: 16 / 7; background: var(--surface-2); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); } .modal-body { padding: 18px; } }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 1.6rem; font-weight: 700; letter-spacing: .12em; background: var(--sand); padding: 8px 16px; border-radius: 10px; display: inline-block; }

/* ---------- Katalog ---------- */
.hero { padding-block: 40px 24px; }
.hero h1 { color: var(--accent); max-width: 20ch; }
.hero p { margin-top: 12px; color: var(--muted); font-size: 1.1rem; font-weight: 300; max-width: 96ch; }
.toolbar { display: flex; flex-direction: column; gap: 16px; padding-block: 32px 24px; margin-top: 32px; border-top: 1px solid var(--line); }
.toolbar .r1 { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.toolbar .search { position: relative; flex: 1 1 260px; max-width: 460px; }
.toolbar .search input { padding-left: 42px; border-radius: 999px; }
.toolbar .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.toolbar .r2 { display: flex; gap: 14px 22px; flex-wrap: wrap; align-items: center; }
.toolbar .grp { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .grp > .lbl { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); }
.fchip { font: inherit; font-size: .9rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
.fchip:hover { border-color: var(--text); }
.fchip[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: var(--on-mint); }
.toolbar select { width: auto; min-height: 38px; padding-block: 5px; border-radius: 999px; font-weight: 600; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--link); text-decoration: underline; cursor: pointer; padding: 6px; }
.count { color: var(--muted); font-size: .9rem; margin-left: auto; }
.rows { display: flex; flex-direction: column; gap: 36px; padding-bottom: 64px; }
.row-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.row-head h2 { color: var(--accent); font-size: 1.5rem; }
.row-head span { color: var(--muted); font-size: .9rem; }
.row-wrap { position: relative; }
.scroller { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x proximity; padding: 6px 4px 18px; margin-inline: -4px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.arrow { position: absolute; top: 96px; z-index: 5; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--arrow, rgba(0, 15, 53, .9)); color: #fff; cursor: pointer; display: none; place-items: center; box-shadow: var(--shadow); }
.arrow:hover { background: var(--mint); color: var(--on-mint); }
.arrow.l { left: -14px; } .arrow.r { right: -14px; }
@media (hover: hover) and (min-width: 900px) { .row-wrap:hover .arrow { display: grid; } .arrow[hidden] { display: none; } }
.tile { flex: 0 0 236px; scroll-snap-align: start; background: var(--surface); border-radius: 16px; overflow: hidden; cursor: pointer; text-align: left; border: 0; padding: 0; font: inherit; color: var(--text); display: flex; flex-direction: column; transition: transform .18s, box-shadow .18s; }
.tile:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 28px rgba(0, 0, 0, .45); }
.tile[aria-disabled="true"] { cursor: not-allowed; }
.tile[aria-disabled="true"]:hover { transform: none; box-shadow: none; }
.tile[aria-disabled="true"] .tile-img > .cover, .tile[aria-disabled="true"] .tile-body { opacity: .5; }
.tile-img { position: relative; aspect-ratio: 1; background: var(--surface-2); }
.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, .92); }
.ph svg { width: 34%; height: 34%; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.chips { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
.chip { font-size: .8rem; font-weight: 700; letter-spacing: .01em; padding: 5px 12px; border-radius: 999px; line-height: 1.25; white-space: nowrap; text-rendering: optimizeLegibility; -webkit-font-smoothing: auto; box-shadow: 0 1px 2px rgba(0, 10, 40, .28); }
.chip.biz { background: #fff; color: #001957; }
.chip.priv { background: #f79506; color: #001957; }
.chip.type { background: #001957; color: #fff; }
.chip.few { background: #f79506; color: #001957; }
.chip.full { background: #ff4c4c; color: #001957; }
.chips-b { position: absolute; left: 10px; bottom: 10px; z-index: 2; display: flex; gap: 6px; }
.tile-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.tile-body h3 { font-size: 1.02rem; line-height: 1.2; max-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; min-height: 2.4em; }
.tile-meta { font-size: .875rem; color: var(--muted); display: flex; flex-direction: column; gap: 1px; }
.tile-meta b { color: var(--text); font-weight: 700; }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }
.empty h2 { color: var(--text); margin-bottom: 8px; }

/* ---------- Admin ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--surface-2); margin: 24px 0; flex-wrap: wrap; }
.tabs button { font: inherit; font-weight: 700; background: none; border: 0; padding: 10px 18px; cursor: pointer; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--mint); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--surface-2); border-radius: 14px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; min-width: 820px; }
.tbl th { text-align: left; background: var(--surface); padding: 10px 12px; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tbl td { padding: 10px 12px; border-top: 1px solid var(--surface-2); vertical-align: top; }
.tbl tr.past td { opacity: .6; }
.tbl .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text); margin-right: 4px; }
.tag.test { background: var(--mint); color: var(--on-mint); }
.tag.past { background: var(--line); }
.bar { width: 90px; height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: #109da8; }
.bar.warn i { background: #f79506; } .bar.full i { background: #d64545; }
.plist { background: var(--surface); padding: 12px 16px !important; }
.plist ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.plist li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolrow input[type=search] { max-width: 320px; }
.mailprev { background: #f5f5f5; color: #001957; border-radius: 10px; padding: 0; border: 1px solid var(--line); overflow-x: auto; }
pre.ics { background: var(--surface); padding: 12px; border-radius: 10px; overflow-x: auto; font-size: .78rem; max-height: 220px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 200; background: #001957; color: #fff; padding: 12px 20px; border-radius: 999px; box-shadow: var(--shadow); font-weight: 600; max-width: calc(100% - 32px); border: 2px solid #00dcdc; }
.toast.bad { border-color: #ff8484; }

/* ---------- Handbuch ---------- */
.manual-tools { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0 8px; }
.manual { --mtext: var(--text); }
.manual-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; margin-top: 24px; align-items: start; }
.manual-toc { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 2px; font-size: .95rem; }
.manual-toc a { padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--text); font-weight: 600; }
.manual-toc a:hover { background: var(--surface); }
@media (max-width: 900px) { .manual-layout { grid-template-columns: minmax(0, 1fr); } .manual-toc { position: static; } }
.manual-body h2 { color: var(--accent); margin: 40px 0 12px; scroll-margin-top: 90px; }
.manual-body h2:first-child { margin-top: 0; }
.manual-body h3 { margin: 24px 0 8px; }
.manual-body p, .manual-body ul, .manual-body ol { margin: 0 0 12px; max-width: 72ch; }
.manual-body li { margin-bottom: 4px; }
.manual-body figure { margin: 16px 0 24px; }
.manual-body figure img { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
.manual-body figcaption { font-size: .85rem; color: var(--muted); margin-top: 6px; }
.manual-body table { border-collapse: collapse; margin: 8px 0 16px; font-size: .95rem; }
.manual-body th, .manual-body td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
.manual-body th { background: var(--surface); }
.manual-body .tip { background: var(--sand); padding: 12px 16px; border-radius: 10px; margin: 12px 0; max-width: 72ch; }
.manual-body .chipdemo { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.manual-body .cd-biz { background: #fff; color: #001957; border: 1px solid #001957; }
.manual-body .cd-priv { background: #f79506; color: #001957; }
.manual-body .cd-type { background: #001957; color: #fff; }
.manual-body .cd-few { background: #f79506; color: #001957; }
.manual-body .cd-full { background: #ff4c4c; color: #001957; }
.manual-body kbd { font-family: inherit; background: var(--surface-2); border-radius: 6px; padding: 1px 8px; font-weight: 700; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
.top .wrap, footer.foot .wrap { max-width: none; }
@media (min-width: 1400px) { .top .wrap, footer.foot .wrap { padding-inline: 48px; } }

.hero .hero-cta { margin-top: 24px; max-width: none; }
.toolbar .grp.types { flex: 1 1 100%; }
.stage-prev { --bg: #001957; --surface: #143a86; --accent: #f79506; --text: #fff; background: var(--bg); color: var(--text); border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stage-prev b { color: var(--accent); font-size: 1.15rem; }
.stage-prev .sw { background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: .9rem; }

/* Admin: Navigation links, Inhalt rechts */
.admin-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 16px; }
.admin-nav { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 20px; }
.admin-grp { display: flex; flex-direction: column; gap: 2px; }
.admin-grp h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px 12px; }
.admin-nav button { font: inherit; font-weight: 600; text-align: left; background: none; border: 0; color: var(--text); padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.admin-nav button:hover { background: var(--surface); }
.admin-nav button[aria-current="page"] { background: var(--blue); color: #fff; }
:root[data-theme="dark"] .admin-nav button[aria-current="page"] { background: var(--mint); color: var(--on-mint); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .admin-nav button[aria-current="page"] { background: var(--mint); color: var(--on-mint); } }
.admin-title { font-size: 1.5rem; margin-bottom: 20px; }
@media (max-width: 900px) {
  .admin-layout { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .admin-nav { position: static; flex-direction: row; flex-wrap: wrap; gap: 8px 20px; }
  .admin-grp { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; }
  .admin-grp h3 { margin: 0 6px 0 0; }
}
.hero-prev { display: block; padding: 24px; }
.hero-prev .ph-t { color: var(--accent); font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
.hero-prev .ph-x { margin-top: 8px; color: var(--muted); }

.afilter { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-end; margin-bottom: 8px; }
.afld { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.afld.wide { flex: 1 1 260px; min-width: 220px; }
.afld label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); }
.afld input, .afld select { min-height: 42px; }
.toolrow { min-height: 28px; }

.demo-why { flex: 1 1 100%; margin-top: 2px; }
.demo-why summary { cursor: pointer; font-weight: 700; color: var(--link); }
.demo-why p { margin: 6px 0; max-width: 90ch; }

.chips-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-inline .chip.type { background: #001957; color: #fff; }
.chips-inline .chip.biz { background: #fff; color: #001957; border: 1.5px solid #001957; }

.notice.warn { background: var(--sand); border-left: 5px solid #eb6504; color: var(--text); display: flex; flex-direction: column; gap: 4px; line-height: 1.5; }
.notice.warn b { color: var(--text); font-size: 1.05rem; }

/* Admin: Veranstaltungstabelle und Teilnehmenden-Popup */
.tbl-events { min-width: 0; table-layout: auto; }
.tbl-events th, .tbl-events td { padding: 14px 16px; }
.tbl-events tbody tr:hover { background: var(--surface); }
.tbl-events .c-title { width: 40%; }
.tbl-events .c-title b { font-size: 1rem; overflow-wrap: anywhere; }
.tbl-events .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 6px; color: var(--muted); font-size: .86rem; }
.tbl-events .meta .tag { margin: 0; }
.tbl-events .c-when { white-space: nowrap; }
.tbl-events .c-occ { min-width: 110px; }
.tbl-events .c-occ .bar { width: 100%; max-width: 120px; }
.tbl-events .c-act { width: 1%; white-space: nowrap; }
.tbl-events .c-act .acts { flex-wrap: nowrap; justify-content: flex-end; }
.tag.cat-dienstlich { background: var(--blue); color: #fff; }
.tag.cat-privat { background: #f79506; color: #001957; }
@media (max-width: 1100px) { .tbl-events .c-act { white-space: normal; } .tbl-events .c-act .acts { flex-wrap: wrap; } }
.people { gap: 18px; padding-top: 28px; }
.people h2 { font-size: 1.35rem; padding-right: 44px; }
.people-occ { display: grid; gap: 6px; }
.bar.wide { width: 100%; height: 10px; }
.people-tbl { min-width: 0; }
.people-tbl td.r { text-align: right; white-space: nowrap; }
.people-tbl code { font-family: ui-monospace, Consolas, monospace; background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }
.people-foot { display: flex; gap: 10px; flex-wrap: wrap; }

/* Buchungs-Popup: breit, niedrig, Bild quadratisch */
.modal.xwide { max-width: 1320px; }
.bk { display: grid; grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
.bk-side { background: #001957; align-self: stretch; }
.bk-img { position: relative; aspect-ratio: 1; background: var(--surface-2); }
.bk-main { padding: 26px 28px 24px; gap: 14px; }
.bk-main h2 { font-size: 1.5rem; padding-right: 44px; overflow-wrap: anywhere; }
.bk-main h3 { font-size: 1.05rem; margin: 2px 0 -4px; }
.bk-desc { max-height: 230px; overflow-y: auto; padding-right: 8px; }
.facts.f3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.facts.f4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pcard { display: flex; flex-direction: column; gap: 14px; }
.pcard h2 { font-size: 1.4rem; }
.pc-cols { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 28px; align-items: end; }
.codebox .hint { margin: 0 0 4px; }
.codebox .code { font-size: 1.35rem; padding: 6px 14px; }
.teams-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; background: var(--surface); border: 1.5px solid var(--mint); border-radius: 14px; padding: 12px 16px; }
.teams-box .tb-l { grid-column: 1 / -1; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); }
.teams-box .tb-link { font-weight: 700; overflow-wrap: anywhere; font-size: .95rem; }
.bk-main .notice { padding: 10px 14px; font-size: .92rem; }
.bk-main .notice.warn b { font-size: 1rem; }
@media (max-width: 860px) {
  .bk { grid-template-columns: minmax(0, 1fr); }
  .bk-side { background: none; }
  .bk-img { width: 150px; margin: 16px 0 0 18px; border-radius: 16px; overflow: hidden; }
  .facts.f3, .facts.f4, .pc-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .teams-box { grid-template-columns: minmax(0, 1fr); }
  .pc-cols { grid-template-columns: minmax(0, 1fr); }
}

.bk-facts { margin: 0; padding: 18px 20px 22px; display: grid; gap: 12px; color: #fff; }
.bk-facts dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: #00dcdc; }
.bk-facts dd { margin: 0; font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.chip.topic { background: #00dcdc; color: #001957; }
.bk-free { margin-left: auto; font-weight: 700; color: var(--text); background: var(--surface); border-radius: 999px; padding: 8px 16px; }
.bk-free.few { background: #f79506; color: #001957; }
@media (max-width: 860px) { .bk-facts { background: #001957; margin-top: 10px; } .bk-side { background: none; } .bk-facts { border-radius: 14px; margin: 12px 18px 0; } }

.tile-host { display: flex; min-width: 0; white-space: nowrap; }
.tile-host-n { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Statistik */
:root { --st0: #109da8; --st1: #f79506; --st2: #109da8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --st0: #17a0ac; --st1: #cf7a00; --st2: #17a0ac; } }
:root[data-theme="dark"] { --st0: #17a0ac; --st1: #cf7a00; --st2: #17a0ac; }
.st-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 8px 0 20px; }
.st-kpi { background: var(--surface); border-left: 4px solid var(--accent); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.st-kpi b { font-size: 1.7rem; line-height: 1.15; font-weight: 900; }
.st-kpi span { font-size: .85rem; color: var(--muted); }
.st-grid-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; }
.st-card { border: 1px solid var(--surface-2); border-radius: 16px; padding: 18px 20px 16px; min-width: 0; }
.st-card.st-wide { grid-column: 1 / -1; }

/* ====================================================== R+V-Design: Ausrichtung am Design-System
   4 px Radius, keine Schatten und Verlaeufe, Fokusring in Highlight, Bold-Headlines, Topline in RuV Slab */
h1, h2, h3, h4 { line-height: 1.15; }
h1 { font-size: clamp(2rem, 4vw + .5rem, 3.25rem); font-weight: 700; letter-spacing: 0; }
h2 { font-size: clamp(1.5rem, 2vw + 1rem, 2.25rem); font-weight: 700; }
h3 { font-size: 1.25rem; line-height: 1.2; }
a { text-decoration: underline; text-underline-offset: 2px; }
.btn, nav.main a, .admin-nav button, .manual-toc a, .brand, .linkbtn, .tabs button { text-decoration: none; }
.linkbtn { text-decoration: underline; }
.topline { font-family: var(--font-slab); font-weight: 700; font-size: 1.2rem; line-height: 1.3; color: var(--accent); margin-bottom: 8px; }
.hl { color: var(--accent); }
.hero h1 { color: var(--text); }
.hero h1 .hl { color: var(--accent); }
.field .req, .demo-banner b { color: var(--text); }
.ruv-i { font-family: "RuV-Icons-v3"; font-style: normal; font-weight: 400; line-height: 1; display: inline-block; speak: none; -webkit-font-smoothing: antialiased; }
.ruv-i.flip { transform: scaleX(-1); }
.btn .ruv-i, .linkbtn .ruv-i { font-size: 1.15em; }
.toolbar .search .ruv-i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--muted); }
.rte-bar button .ruv-i { font-size: 18px; }
.ph .ruv-i { font-size: 76px; color: rgba(255, 255, 255, .92); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-color: var(--text); }
.btn, input[type=text], input[type=email], input[type=url], input[type=number], input[type=password], input[type=search], input[type=date], select, textarea,
.seg, .seg label, .seg button, .panel, .notice, .rte, .rte-bar button, .imgprev, .crop-box, .crop-box::after, .modal, .code, .fchip, .toolbar .search input, .toolbar select,
.tile, .chip, .tag, .toast, .tbl-wrap, .bar, .st-card, .st-kpi, .teams-box, .stage-prev, .mailprev, pre.ics, .manual-body figure img, .manual-body .tip, kbd, .manual-body kbd,
nav.main a, .admin-nav button, .manual-toc a, .st-sw, .st-track i, .demo-banner, .bk-free, .stage .seg, .arrow-sq { border-radius: var(--r); }
.btn-primary:hover { background: var(--mint-hover); }
.btn-secondary { border-color: currentColor; }
.btn-danger { background: transparent; color: var(--text); border-color: currentColor; }
.btn-danger:hover { background: var(--surface); }
.btn-danger[data-c] { background: var(--text); color: var(--bg); }
.modal, .tile:hover, .arrow, .toast, .chip { box-shadow: none; }
.modal { border: 1px solid var(--line); }
.tile { border: 1px solid transparent; }

.chip.full { background: #707070; color: #fff; }

.notice { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--sand); color: var(--text); font-weight: 400; }
.notice::before { font-family: "RuV-Icons-v3"; font-size: 1.35rem; line-height: 1; flex: none; content: "\e900"; }
.notice.warn::before { content: "\e903"; }
.notice.ok::before { content: "\e931"; color: var(--ok); }
.notice.bad::before { content: "\e985"; color: var(--danger); }

.notice.ok { border: 2px solid var(--ok); }

.st-kpi { border: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--sand); }

.agenda-list li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; }

.agenda-list .ag-t { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.agenda-list .ag-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.idd-box { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.idd-body { display: flex; flex-direction: column; gap: 16px; }
.idd-confirm { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.cf-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.cf-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.idd-prog { height: 10px; background: #e3e8f3; border-radius: 4px; overflow: hidden; margin: 16px 0 6px; }
.idd-prog i { display: block; height: 100%; background: #f79506; }
.idd-box { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
/* 0.29.3: Footer immer am Seitenende; bei kurzen Seiten am unteren Fensterrand */
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
body > main#main { flex: 1 0 auto; width: 100%; }
body > footer.foot { flex-shrink: 0; margin-top: 0; }
/* 0.30: Jahresauswahl ohne Rahmen; das gewaehlte Jahr ist hervorgehoben */
.yearbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 4px; }
.yearbar button { font: inherit; font-weight: 700; padding: 6px 14px; border: 2px solid transparent; border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; }
.yearbar button:hover { text-decoration: underline; }
.yearbar button[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: var(--on-mint); text-decoration: none; }
.yearbar button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
/* 0.30: Agenda-Editor */
.ag-field { display: flex; flex-direction: column; gap: 12px; }
.ag-kpis { display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline; }
.ag-warn { color: var(--danger); font-weight: 700; }
.ag-ok { color: var(--ok); font-weight: 700; }
.ag-edit { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.ag-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 4px; }
.ag-row:not(.fixed) .ag-t { grid-row: 1 / span 2; align-self: start; padding-top: 26px; }
.ag-row:not(.fixed) .ag-l:first-of-type { grid-column: 2 / -1; }
.ag-row.fixed { grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; background: var(--surface); }
.ag-row .ag-t { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; align-self: center; }
.ag-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ag-l input, .ag-l select { width: 100%; }
.ag-acts { display: flex; gap: 6px; }
.ag-foot { display: flex; gap: 20px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 12px; }
@media (max-width: 760px) { .ag-row, .ag-row.fixed { grid-template-columns: 1fr 1fr; } .ag-row:not(.fixed) .ag-t { grid-row: auto; padding-top: 0; } .ag-row .ag-t, .ag-row:not(.fixed) .ag-l:first-of-type, .ag-acts { grid-column: 1 / -1; } }
