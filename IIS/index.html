<style>
/* Layout: weisser Seitenrahmen im R+V-Stil (dunkelblaue Schrift, orange Ueberschriften-Highlights, mintfarbene Interaktion),
   der Katalog liegt als dunkelblaue "Buehne" (Netflix-Stil) mit Kachelreihen pro Thema. */
:root {
  --font: "R+V Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; /* R+V-Schrift folgt: hier @font-face ergaenzen */
  --bg: #ffffff;
  --surface: #f5f5f5;
  --surface-2: #ececec;
  --line: #c7c7c7;
  --text: #001957;
  --muted: #5c5c5c;
  --accent: #eb6504;
  --link: #0c7f89;
  --mint: #00dcdc;
  --mint-hover: #34e6e6;
  --on-mint: #001957;
  --blue: #001957;
  --sand: #fff4e0;
  --danger: #b3261e;
  --danger-bg: #ffe9e9;
  --ok: #4d6a03;
  --ok-bg: #f0f8e3;
  --shadow: 0 6px 24px rgba(0, 25, 87, .16);
  --focus: #109da8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000f35; --surface: #001957; --surface-2: #0b2a6e; --line: #2a4585; --text: #ffffff; --muted: #b9c4de;
    --accent: #f79506; --link: #00dcdc; --sand: #0b2a6e; --danger: #ff8484; --danger-bg: #4a1a2a; --ok: #8ebc27; --ok-bg: #12331f;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5); --focus: #00dcdc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000f35; --surface: #001957; --surface-2: #0b2a6e; --line: #2a4585; --text: #ffffff; --muted: #b9c4de;
  --accent: #f79506; --link: #00dcdc; --sand: #0b2a6e; --danger: #ff8484; --danger-bg: #4a1a2a; --ok: #8ebc27; --ok-bg: #12331f;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); --focus: #00dcdc; color-scheme: dark;
}
/* Katalog-Buehne: immer dunkel, unabhaengig vom Theme */
.stage {
  --bg: #001957; --surface: #0b2a6e; --surface-2: #143a86; --line: #2a4585; --text: #ffffff; --muted: #c4cde3;
  --accent: #f79506; --link: #00dcdc; --focus: #00dcdc; --danger: #ff8484; --danger-bg: #4a1a2a; --ok: #8ebc27;
  background: var(--bg); color: var(--text); color-scheme: dark; transition: background-color .25s;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw + .5rem, 3rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.6rem; font-weight: 800; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--link); }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 720px) { .wrap { padding-inline: 32px; } }
@media (min-width: 1400px) { .wrap.wide { padding-inline: 48px; } }
.accent { color: var(--accent); }
.wrap.wide { max-width: none; }

/* ---------- Kopf ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--surface-2); }
.top .wrap { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text); min-width: 0; }
.brand img { height: 34px; width: auto; display: block; }
.brand .sep { width: 1px; height: 28px; background: var(--line); }
.brand .name { font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em; white-space: nowrap; }
.brand .name .at { color: var(--accent); }
nav.main { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.main a { text-decoration: none; color: var(--text); font-weight: 600; padding: 8px 14px; border-radius: 999px; font-size: .95rem; display: inline-flex; gap: 6px; align-items: center; }
nav.main a:hover { background: var(--surface); }
nav.main a[aria-current="page"] { background: var(--blue); color: #fff; }
:root[data-theme="dark"] nav.main a[aria-current="page"] { background: var(--mint); color: var(--on-mint); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) nav.main a[aria-current="page"] { background: var(--mint); color: var(--on-mint); } }
@media (max-width: 760px) {
  nav.main { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  nav.main a { white-space: nowrap; }
  .brand .name { font-size: 1.05rem; }
}
.demo-banner { background: var(--sand); color: var(--text); font-size: .875rem; border-bottom: 1px solid var(--line); }
.demo-banner .wrap { padding-block: 8px; display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.demo-banner b { color: var(--accent); }

main { min-height: 60vh; }
.page { padding-block: 32px 64px; }
.page > .wrap > h1 { margin-bottom: 8px; }
.lead { font-size: 1.1rem; color: var(--muted); max-width: 62ch; }
.narrow { max-width: 820px; }

footer.foot { background: var(--blue); color: #fff; font-size: .9rem; }
footer.foot .wrap { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: center; padding-block: 24px; }
footer.foot img { height: 30px; width: auto; }
footer.foot a { color: #00dcdc; }
footer.foot .sp { margin-left: auto; opacity: .8; }

/* ---------- Buttons & Formularelemente ---------- */
.btn { font: inherit; font-weight: 700; border: 2px solid transparent; border-radius: 999px; padding: 11px 24px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; line-height: 1.2; min-height: 46px; transition: background .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--mint); color: var(--on-mint); }
.btn-primary:hover { background: var(--mint-hover); }
.btn-secondary { background: transparent; color: var(--text); border-color: currentColor; }
.btn-secondary:hover { background: var(--surface); }
.stage .btn-secondary:hover { background: rgba(255, 255, 255, .1); }
.btn-danger { background: transparent; color: var(--danger); border-color: currentColor; }
.btn-danger:hover { background: var(--danger-bg); }
.btn-sm { padding: 6px 14px; min-height: 36px; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg, .ico { width: 1.1em; height: 1.1em; flex: none; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 700; font-size: .95rem; }
.field .req { color: var(--accent); }
.hint { font-size: .85rem; color: var(--muted); }
.err { font-size: .875rem; color: var(--danger); font-weight: 600; }
input[type=text], input[type=email], input[type=url], input[type=number], input[type=password], input[type=search], input[type=date], select, textarea {
  font: inherit; color: var(--text); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0;
}
select { padding-right: 8px; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.invalid input, .invalid select, .invalid .rte, .invalid .seg { border-color: var(--danger); }
.stage input, .stage select { background: var(--surface); border-color: var(--line); }
::placeholder { color: var(--muted); opacity: .8; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--bg); max-width: 100%; }
.seg label, .seg button { font: inherit; font-weight: 700; padding: 8px 18px; border-radius: 999px; cursor: pointer; border: 0; background: transparent; color: var(--text); font-size: .95rem; white-space: nowrap; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked), .seg button[aria-pressed="true"] { background: var(--mint); color: var(--on-mint); }
.seg label:has(input:focus-visible), .seg button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.stage .seg { background: var(--surface); }
.field > .seg { align-self: flex-start; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.form { display: flex; flex-direction: column; gap: 32px; margin-top: 28px; }
.fs { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.fs > legend { font-size: 1.25rem; font-weight: 800; padding: 0; margin-bottom: 4px; color: var(--accent); float: left; width: 100%; }
.fs > legend + * { clear: both; }
.panel { background: var(--surface); border-radius: 16px; padding: 24px; }
.notice { border-radius: 12px; padding: 12px 16px; font-size: .95rem; background: var(--sand); }
.notice.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.notice.bad { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
.notice.info { background: var(--surface); }

/* ---------- Editor ---------- */
.rte { border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.rte:focus-within { border-color: var(--focus); }
.rte-bar { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; background: var(--surface); border-bottom: 1px solid var(--line); }
.rte-bar button { font: inherit; border: 0; background: transparent; color: var(--text); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.rte-bar button:hover { background: var(--surface-2); }
.rte-bar button[aria-pressed="true"] { background: var(--mint); color: var(--on-mint); }
.rte-bar .sepv { width: 1px; background: var(--line); margin: 4px 6px; }
.rte-link { display: flex; gap: 8px; padding: 8px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rte-link input { flex: 1 1 200px; min-height: 38px; }
.rte-area { min-height: 170px; max-height: 420px; overflow-y: auto; padding: 12px 14px; outline: none; }
.rte-area:empty::before { content: attr(data-ph); color: var(--muted); }
.rte-foot { display: flex; justify-content: space-between; padding: 4px 12px 8px; font-size: .8rem; color: var(--muted); }
.rich h3, .rte-area h3 { font-size: 1.1rem; margin: .8em 0 .3em; }
.rich p, .rte-area p, .rte-area div { margin: 0 0 .6em; }
.rich ul, .rich ol, .rte-area ul, .rte-area ol { margin: 0 0 .7em; padding-left: 1.4em; }
.rich blockquote, .rte-area blockquote { margin: 0 0 .7em; padding: 4px 14px; border-left: 4px solid var(--mint); background: var(--surface); }

/* ---------- Bild-Upload ---------- */
.imgpick { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.imgprev { width: 160px; height: 160px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: .85rem; text-align: center; padding: 8px; flex: none; }
.imgprev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.crop { width: min(100%, 360px); margin-inline: auto; }
.crop-box { position: relative; width: 100%; aspect-ratio: 1; background: #000; border-radius: 10px; overflow: hidden; touch-action: none; cursor: grab; }
.crop-box canvas { width: 100%; height: 100%; display: block; }
.crop-box::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: 2px solid rgba(255, 255, 255, .9); border-radius: 10px;
  background: linear-gradient(to right, transparent 33%, rgba(255,255,255,.4) 33%, rgba(255,255,255,.4) calc(33% + 1px), transparent calc(33% + 1px), transparent 66%, rgba(255,255,255,.4) 66%, rgba(255,255,255,.4) calc(66% + 1px), transparent calc(66% + 1px)),

<script>window.__LT__ = {"version": "0.12.0", "mode": "iis", "manualHtml": "<h2>Worum es geht<\/h2>\n<p>LearnTogether@AD ist eine Plattform für informelles Lernen im R+V-Außendienst. Kolleginnen und Kollegen bieten kurze Online-Termine an, zum Beispiel einen Workshop, einen Austausch oder eine Best-Practice-Runde. Alle anderen können sich dafür anmelden. Themen dürfen dienstlich oder privat sein.<\/p>\n<p>Alle Veranstaltungen finden online in <b>Microsoft Teams<\/b> statt, <b>montags bis freitags<\/b>, entweder <b>morgens von 06:00 bis 09:00 Uhr<\/b> oder <b>nachmittags von 17:00 bis 20:00 Uhr<\/b>. Eine einzelne Veranstaltung dauert höchstens zwei Stunden.<\/p>\n<p>Du brauchst kein Benutzerkonto und kein Passwort. Zum Anmelden genügen dein Name und deine E-Mail-Adresse. Die Anwendung verschickt <b>keine E-Mails<\/b>: Alle Angaben zu deiner Anmeldung siehst du direkt im Programm.<\/p>\n<p>Die Anwendung hat vier Bereiche, die du oben in der Navigation findest:<\/p>\n<table>\n<tr><th>Bereich<\/th><th>Wofür du ihn brauchst<\/th><\/tr>\n<tr><td>Katalog<\/td><td>Veranstaltungen entdecken und dich anmelden<\/td><\/tr>\n<tr><td>Veranstaltung anbieten<\/td><td>Selbst einen Termin anlegen<\/td><\/tr>\n<tr><td>Meine Anmeldung<\/td><td>Teams-Link und Kalendereintrag abrufen, Anmeldung stornieren<\/td><\/tr>\n<tr><td>Handbuch<\/td><td>Diese Anleitung<\/td><\/tr>\n<\/table>\n\n<h2>Der Katalog<\/h2>\n<p>Der Katalog zeigt alle Veranstaltungen, die noch in der Zukunft liegen. Er ist wie eine Mediathek aufgebaut: Zu jedem Thema gibt es eine Reihe mit Kacheln, die du seitlich durchblättern kannst. Auf dem Computer erscheinen beim Darüberfahren Pfeile, auf dem Handy wischst du mit dem Finger.<\/p>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaA /p>\n<h3>Suchen und filtern<\/h3>\n<ul>\n<li><b>Suche:<\/b> Sie durchsucht Titel, Beschreibung, Thema und den Namen der durchführenden Person.<\/li>\n<li><b>Thema:<\/b> Zeigt nur die Reihe des gewählten Themas. Mit „Alle“ siehst du wieder alle Reihen.<\/li>\n<li><b>Art:<\/b> Wähle eine oder mehrere Arten der Veranstaltung, standardmäßig Workshop, Austausch und Best Practice. Tippe erneut auf eine Art, um sie wieder abzuwählen.<\/li>\n<li><b>Dauer:<\/b> Mit „Alle“ siehst du jede Länge, sonst nur Veranstaltungen bis 30, 60, 90 Minuten oder bis 2 Stunden.<\/li>\n<li><b>Tageszeit:<\/b> „Morgens“ zeigt Termine zwischen 06:00 und 09:00 Uhr, „Nachmittags“ Termine zwischen 17:00 und 20:00 Uhr.<\/li>\n<\/ul>\n<p>Mit „Filter zurücksetzen“ siehst du wieder alles.<\/p>\n<h3>Eine Kachel lesen<\/h3>\n<p>Jede Kachel zeigt das Bild der Veranstaltung (oder ein Platzhalterbild), den Titel, den Tag, die Uhrzeit, die Dauer und die durchführende Person. Über dem Bild stehen Chips:<\/p>\n<table>\n<tr><th>Chip<\/th><th>Bedeutung<\/th><\/tr>\n<tr><td><span class=\"chipdemo cd-biz\">Dienstlich<\/span> <span class=\"chipdemo cd-priv\">Privat<\/span><\/td><td>Ob die Veranstaltung dienstlich oder privat ist<\/td><\/tr>\n<tr><td><span class=\"chipdemo cd-type\">Workshop<\/span><\/td><td>Die Art: Workshop, Austausch oder Best Practice<\/td><\/tr>\n<tr><td><span class=\"chipdemo cd-few\">Fast ausgebucht<\/span><\/td><td>Es sind höchstens noch 5 Plätze frei<\/td><\/tr>\n<tr><td><span class=\"chipdemo cd-full\">Ausgebucht<\/span><\/td><td>Alle Plätze sind vergeben. Die Kachel lässt sich nicht mehr öffnen<\/td><\/tr>\n<\/table>\n\n<h2>Für eine Veranstaltung anmelden<\/h2>\n<ol>\n<li>Klicke im Katalog auf eine Kachel. Ein Fenster mit allen Details öffnet sich: Datum, Uhrzeit, Dauer, durchführende Person, freie Plätze und die Beschreibung.<\/li>\n<li>Trage deinen <b>Namen<\/b> und deine <b>E-Mail-Adresse<\/b> ein.<\/li>\n<li>Klicke auf <b>Anmelden<\/b>.<\/li>\n<\/ol>\n<figure><img src=\"data:image/jpe CIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIg//Z\" alt=\"Das Formular zum Anlegen einer Veranstaltung.\"><figcaption>Das Formular zum Anlegen einer Veranstaltung.<\/figcaption><\/figure>\n<p>Das Formular ist in fünf Abschnitte gegliedert:<\/p>\n<table>\n<tr><th>Abschnitt und Feld<\/th><th>Was du eingibst<\/th><\/tr>\n<tr><td><b>Wer bietet es an?<\/b><br>Name<\/td><td>Dein Vor- und Nachname<\/td><\/tr>\n<tr><td>E-Mail-Adresse<\/td><td>Deine E-Mail-Adresse für Rückfragen der Administration. Sie erscheint nicht im Katalog<\/td><\/tr>\n<tr><td><b>Worum geht es?<\/b><br>Titel<\/td><td>Ein aussagekräftiger Name, bis zu 100 Zeichen<\/td><\/tr>\n<tr><td>Auswahl des Themenbereichs<\/td><td>Dienstlich oder privat. Davon hängen die Themen zur Auswahl ab<\/td><\/tr>\n<tr><td>Thema<\/td><td>Dienstlich: fachlich oder vertrieblich. Privat: Sport, Freizeit, Essen &amp; Trinken, Reisen oder Sonstiges<\/td><\/tr>\n<tr><td><b>Wann findet es statt?<\/b><br>Tag<\/td><td>Ein Datum aus dem Datumsfeld. Nur Montag bis Freitag sind möglich; ein Wochenende wird abgelehnt<\/td><\/tr>\n<tr><td>Dauer<\/td><td>15 bis 120 Minuten in 15-Minuten-Schritten<\/td><\/tr>\n<tr><td>Startzeit<\/td><td>Nur Zeiten, die zur gewählten Dauer passen (siehe unten)<\/td><\/tr>\n<tr><td><b>Was wird angeboten?<\/b><br>Art der Veranstaltung<\/td><td>Zum Beispiel Workshop, Austausch oder Best Practice. Die Auswahl legt die Administration fest<\/td><\/tr>\n<tr><td>Maximale Teilnehmendenzahl<\/td><td>Wie viele Personen teilnehmen können (1 bis 50)<\/td><\/tr>\n<tr><td>Beschreibung<\/td><td>Der Text für den Katalog, mit Formatierungen. Er wird im Katalog angezeigt, sobald jemand auf die Kachel klickt<\/td><\/tr>\n<tr><td>Bild<\/td><td>Optional. Ein quadratisches Bild für die Kachel<\/td><\/tr>\n<tr><td><b>Teams-Link<\/b><\/td><td>Der Einladungslink deiner Teams-Besprechung<\/td><\/tr>\n<\/table>\n<h3>Zeitfenster und Startzeit<\/h3>\n<p>Veranstaltungen sind nur in zwei Zeitfenstern möglich:<\/p>\n<ul>\n<li><b>Morgens:<\/b> Start frühestens 06:00 Uhr, Ende spätestens 09:00 Uhr<\/li>\n<li><b>Nachmittags:<\/b> Start frühestens 17:00 Uhr, Ende spätestens 20:00 Uhr<\/li>\n<\/ul>\n<p>Wähle deshalb zuerst den Tag und die <b>Dauer<\/b>. Danach zeigt die Auswahl der Startzeit nur noch Zeiten, bei denen die Veranstaltung rechtzeitig endet. Bei zwei Stunden ist zum Beispiel ein Start um 07:00 Uhr (Ende 09:00 Uhr) möglich, um 07:15 Uhr aber nicht mehr. Ändert sich die Dauer und die gewählte Startzeit passt nicht mehr, wirst du gebeten, eine neue Startzeit zu wählen. Für den heutigen Tag sind Zeiten, die schon vorbei sind, gesperrt.<\/p>\n<h3>Die Beschreibung schreiben<\/h3>\n<p>Der Editor bietet die wichtigsten Formatierungen: <b>fett<\/b>, <i>kursiv<\/i>, <u>unterstrichen<\/u>, durchgestrichen, Zwischenüberschrift, Aufzählung, nummerierte Liste, Zitat und Links. Markiere den Text und klicke auf das passende Symbol. Bei einem Link gibst du die Adresse ein und bestätigst mit „Übernehmen“. Mit „Rückgängig“ und „Wiederholen“ korrigierst du Änderungen. Wenn du Text aus Word oder einer Webseite einfügst, wird ungewollte Formatierung automatisch entfernt.<\/p>\n<div class=\"tip\">Gute Beschreibungen sagen, worum es geht, was die Teilnehmenden erwartet und ob sie etwas mitbringen sollen. Drei bis fünf Sätze reichen.<\/div>\n<h3>Ein Bild hochladen<\/h3>\n<ol>\n<li>Klicke auf <b>Bild auswählen<\/b> und wähle ein Foto (JPG, PNG oder WebP).<\/li>\n<li>Im Fenster „Bild zuschneiden“ ziehst du das Bild mit der Maus oder dem Finger an die passende Stelle. Mit dem Regler oder dem Mausrad zoomst du hinein.<\/li>\n<li>Klicke auf <b>Ausschnitt übernehmen<\/b>. Das Bild wird quadratisch gespeichert.<\/li>\n<\/ol>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAJwAoADASIAAhEBAxEB/8QAHAABAAICAwEAAAAAAAAAAAAAAAYHAwUBAgQI/8QAWRAAAQMCAgQFCw4MBQMEAwEAAAECAwQFBhEHEiExEzJBcdIUFyIzNlFUYXKywRYYNVZzgYKRk5SjpLHRCBUjNDdCU1WDkqGzJFJXptNidOIlQ+HwOKK0wv/EABwBAQABBQEBAAAAAAAAAAAAAAACAwQFBgcBCP/EAEMRAAIBAQMGCgkCBQQDAQEAAAABAgMEETEFEiFRcbEGFTM0QVKBkaHRExQWMlNhcsHhIvBiY6LS4gcjQpIkgvElF//aAAwDAQACEQMRAD8A0OCcK3DF95bQ29qNa1NeaZ3FiZ318feTl+M+kcL6McM2CFuVCyvqU2rPWNSRc/E1exT3kz8Zzogw7Fh7BNCmplV1jEqqhyptVXJmjfeTJOfPvk1KtSo27kRSOkMMUDNSCNkbE/VY1ET+h3AKRIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA1OI8R2jDdEtVe6+Cji/V13dk/wATWptcvMhVF2/CFssEjm2u0V1YifryvbCi83GX40KkKM6nuojKcY4su06TQxTs1J42SMX9V7UVP6lK2j8IWyzyNbdLRXUaL+vE9syJz8VcuZC2MOYitGJKJKqyV8FZD+tqL2TPE5q7WrzoJ0Z0/eQjOMsGR7FGjHDN/idnQsoKldqT0bUjXPxtTsV99M/GfN2NsK3DCF5dQ3FqOa5NeGZnFlZ308ffTk+I+xyE6YMOx4hwTWojM6ujYtVA5EzXNqZq330zTny7x7TqNO5homkMbYomRsTJrGo1OZDsAUiQAITinSng3Ct4ktd+vHUlfG1r3RdSzSZI5M02tYqbvGSjGUndFXnjaWJNgQSyaXcCXqtipKDEdMtRKuqxs0ckGsvIiLI1qZ+I3WPcW0GCMNzXu6xVU1LE9jHMpmtc/Ny5JkjnIn9T105pqLWk8zldfeSEEKotI9oq9G0mN chen Kundendaten oder interne Geschäftsgeheimnisse weiter.<\/li>\n<li>Verstößt eine Veranstaltung gegen diese Regeln, kann die Administration sie ändern oder löschen.<\/li>\n<\/ul>\n\n<h2>Häufige Fragen<\/h2>\n<h3>Muss ich mich registrieren oder anmelden?<\/h3>\n<p>Nein. Der Katalog, das Anlegen von Veranstaltungen und die Anmeldung funktionieren ohne Benutzerkonto und ohne Passwort.<\/p>\n<h3>Wer sieht meine Angaben?<\/h3>\n<p>Dein Name und deine E-Mail-Adresse werden nur für die Anmeldung gespeichert. Sie sind für die Administration der Plattform sichtbar, nicht für andere Teilnehmende.<\/p>\n<h3>Warum kann ich eine Kachel nicht öffnen?<\/h3>\n<p>Die Veranstaltung ist ausgebucht. Vielleicht werden Plätze durch Stornierungen wieder frei. Schau später noch einmal nach.<\/p>\n<h3>Ich habe meinen Stornierungscode verloren.<\/h3>\n<p>Öffne <b>Meine Anmeldung<\/b>: Hast du dich mit diesem Gerät und Browser angemeldet, steht die Anmeldung dort unter „Auf diesem Gerät gespeichert“. Sonst wende dich an die Administration. Sie kann deine Anmeldung sehen.<\/p>\n<h3>Bekomme ich eine E-Mail?<\/h3>\n<p>Nein. Die Anwendung verschickt keine E-Mails. Teams-Link, Kalendereintrag und Stornierungscode siehst du direkt nach der Anmeldung und später unter „Meine Anmeldung“.<\/p>\n<h3>Welche Startzeiten sind möglich?<\/h3>\n<p>Veranstaltungen laufen nur zwischen 06:00 und 09:00 Uhr oder zwischen 17:00 und 20:00 Uhr und müssen zum Ende des Zeitfensters beendet sein.<\/p>\n<h3>Das Bild lässt sich nicht hochladen.<\/h3>\n<p>Nutze eine Datei im Format JPG, PNG oder WebP mit höchstens 12 MB. Sehr große Fotos verkleinerst du am besten vorher.<\/p>\n", "manualUrl": "AppData/Handbuch.html", "pdfUrl": "AppData/Nutzerhandbuch.pdf"};</script>
